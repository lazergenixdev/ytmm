[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmm"
version = "2.0.0"
description = "YouTube Music Manager: a music library synced with Syncthing and downloaded by a home server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lazergenixdev", email = "lazergenixdev@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "prompt_toolkit>=3.0.36",
    "ytmusicapi>=1.8",
]

[project.optional-dependencies]
# only the server downloads (also needs ffmpeg and Deno, installed separately)
server = [
    "yt-dlp[default]",
    "mutagen>=1.47",
]
test = ["pytest"]

[project.scripts]
ytmm = "ytmm.cli:main"

[project.urls]
Homepage = "https://github.com/lazergenixdev/ytmm"

[tool.setuptools.packages.find]
include = ["ytmm*"]
