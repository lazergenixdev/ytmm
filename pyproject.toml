[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmm"
version = "2.0.0"
description = "YouTube Music Manager"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "lazergenixdev", email = "lazergenixdev@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["rich>=13", "ytmusicapi>=1.8,<2", "prompt-toolkit>=3.0.43,<4"]

[project.optional-dependencies]
server = ["yt-dlp[default]>=2025.11.12", "mutagen>=1.47"]
testing = ["pytest>=8"]

[project.scripts]
ytmm = "ytmm.cli:main"
ytmm-mvp = "ytmm.mvp:main"

[tool.setuptools.packages.find]
include = ["ytmm*"]

